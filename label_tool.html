<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FineWeb-UK labelling</title>
<style>
:root{color-scheme:light dark;--bg:#f6f6f3;--panel:#fff;--ink:#1c1c1a;--muted:#66665f;--line:#d9d9d2;--accent:#0b5cad;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--panel:#21211f;--ink:#ecece6;--muted:#a3a39a;--line:#3a3a36;--accent:#6db1f2;--on:#0c1a28}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2}
header b{font-weight:600}.grow{flex:1}progress{width:160px;accent-color:var(--accent)}.muted{color:var(--muted);font-size:13px}
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;padding:16px;max-width:1400px;margin:auto}
#doc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:calc(100vh - 90px);overflow:auto;font:15px/1.6 Georgia,serif}
#cut{display:block;margin-top:16px;color:var(--muted);font:13px system-ui}
aside{display:flex;flex-direction:column;gap:8px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}.q.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.q h2{font-size:14px;margin:0;font-weight:600}.q p{margin:2px 0 6px;color:var(--muted);font-size:12.5px;line-height:1.35}
.opts{display:flex;flex-wrap:wrap;gap:5px}button{font:inherit;font-size:13.5px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer;min-height:30px}
button:hover{border-color:var(--accent)}button.sel{background:var(--accent);color:var(--on);border-color:var(--accent)}button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
kbd{font:11px ui-monospace,monospace;opacity:.7;margin-right:4px}.nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}#next{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600;padding:5px 16px}#next:disabled{opacity:.4;cursor:default}
details{font-size:13px;color:var(--muted)}pre{white-space:pre-wrap;font:12.5px/1.45 system-ui}#err{color:#c0392b;font-size:13px;min-height:1em}
@media(max-width:900px){main{grid-template-columns:1fr}#doc{max-height:45vh}header{flex-wrap:wrap}}
</style></head><body>
<header><b>FineWeb-UK</b><span class="muted" id="who"></span><span class="grow"></span><span class="muted" id="count"></span><progress id="bar"></progress></header>
<main><article id="doc" tabindex="0"></article><aside id="side"></aside></main>
<script>
const $=s=>document.querySelector(s);let S,cur=0,ans={},active=0,done=0;
const api=(p,b)=>fetch(p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{}).then(async r=>{const j=await r.json();if(!r.ok)throw Error(j.error);return j});
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function render(){const side=$('#side');side.textContent='';
 S.schema.forEach((q,qi)=>{const box=el('section','q'+(qi===active?' active':''));box.append(el('h2','',`${qi+1}. ${q.prompt}`),el('p','',q.help));
  const row=el('div','opts');q.options.forEach((o,oi)=>{const b=el('button',ans[q.name]===o.value?'sel':'');if(!['quality','croydon'].includes(q.name))b.append(el('kbd','',oi+1));b.append(o.label);b.onclick=()=>pick(qi,o.value);row.append(b)});
  box.append(row);box.onclick=e=>{if(e.target===box||e.target.tagName==='H2'){active=qi;render()}};side.append(box)});
 const nav=el('div','nav');const back=el('button','','Back');back.onclick=()=>go(cur-1);back.disabled=cur===0;
 const next=el('button','','Save and next (Enter)');next.id='next';next.disabled=!S.schema.every(q=>ans[q.name]);next.onclick=save;
 const sk=el('select');sk.setAttribute('aria-label','Skip this document');[['','Skip…'],['unclear','Too unclear to judge'],['upsetting','Upsetting content'],['not_english','Not English']].forEach(([v,t])=>{const o=el('option','',t);o.value=v;sk.append(o)});sk.onchange=()=>sk.value&&send({skip:sk.value});
 nav.append(back,next,sk);side.append(nav,el('div','',''));side.lastChild.id='err';
 const d=el('details');d.append(el('summary','','Scoring guide and shortcuts'),el('pre','',S.rubric+'\n\nKeys: number picks an answer for the highlighted question and moves on. Tab or J/K changes question. Enter saves. Left arrow goes back.'));side.append(d)}
function pick(qi,v){ans[S.schema[qi].name]=v;active=Math.min(qi+1,S.schema.length-1);render()}
async function go(i){if(i<0||i>=S.total)return;const d=await api('/api/doc/'+i);cur=i;ans=d.labels?{...d.labels}:{};active=0;const a=$('#doc');a.textContent=d.text;if(d.cut)a.append(el('span','','Cut at 6,000 characters, the same as the models see. Label only what is shown.'));if(d.cut)a.lastChild.id='cut';a.scrollTop=0;
 $('#count').textContent=`Document ${i+1} of ${S.total} · ${done} saved`;$('#bar').max=S.total;$('#bar').value=done;render()}
async function send(b){try{const r=await api('/api/label',{i:cur,...b});done=r.done;if(cur+1<S.total)await go(cur+1);else{await go(cur);$('#doc').textContent=`Thank you, ${done} of ${S.total} saved. See CONTRIBUTING.md to submit your labels file.`}}catch(e){$('#err').textContent=e.message}}
function save(){if(S.schema.every(q=>ans[q.name]))send({labels:ans})}
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.metaKey||e.ctrlKey||e.altKey)return;const q=S.schema[active];
 if(/^[0-9]$/.test(e.key)){const n=+e.key;const o=q.options[['quality','croydon'].includes(q.name)?n:n-1];if(o){pick(active,o.value);e.preventDefault()}}
 else if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){save();e.preventDefault()}else if(e.key==='ArrowLeft')go(cur-1);
 else if(e.key==='Tab'||e.key==='j'||e.key==='k'){active=(active+(e.key==='k'||e.shiftKey?-1:1)+S.schema.length)%S.schema.length;render();e.preventDefault()}});
api('/api/state').then(s=>{S=s;done=s.done;$('#who').textContent=`${s.annotator} · ${s.set}`;go(s.start)});
</script></body></html>
